# Default YouNeedMe shop catalog - a ready-to-use starting point, not an empty template.
# Reload with /shop reload after editing. Prices use the economy module's default currency.
categories:
  blocks:
    display-name: "<green>Blocks"
    icon: GRASS_BLOCK
    order: 0
    items:
      dirt: { material: DIRT, buy-price: 1.0, sell-price: 0.25 }
      stone: { material: STONE, buy-price: 2.0, sell-price: 0.5 }
      cobblestone: { material: COBBLESTONE, buy-price: 1.5, sell-price: 0.4 }
      oak-log: { material: OAK_LOG, buy-price: 5.0, sell-price: 1.5 }
      sand: { material: SAND, buy-price: 1.5, sell-price: 0.4 }
      glass: { material: GLASS, buy-price: 3.0, sell-price: 0.75 }

  ores:
    display-name: "<gray>Ores & Ingots"
    icon: IRON_ORE
    order: 1
    items:
      coal: { material: COAL, buy-price: 8.0, sell-price: 4.0 }
      iron-ingot: { material: IRON_INGOT, buy-price: 25.0, sell-price: 12.0 }
      gold-ingot: { material: GOLD_INGOT, buy-price: 40.0, sell-price: 20.0 }
      diamond: { material: DIAMOND, buy-price: 250.0, sell-price: 150.0 }
      emerald: { material: EMERALD, buy-price: 200.0, sell-price: 120.0 }
      redstone: { material: REDSTONE, buy-price: 6.0, sell-price: 3.0 }
      lapis-lazuli: { material: LAPIS_LAZULI, buy-price: 6.0, sell-price: 3.0 }

  farming:
    display-name: "<yellow>Farming"
    icon: WHEAT
    order: 2
    items:
      wheat: { material: WHEAT, buy-price: 3.0, sell-price: 1.0 }
      carrot: { material: CARROT, buy-price: 2.0, sell-price: 0.75 }
      potato: { material: POTATO, buy-price: 2.0, sell-price: 0.75 }
      wheat-seeds: { material: WHEAT_SEEDS, buy-price: 1.0, sell-price: 0.25 }
      melon: { material: MELON_SLICE, buy-price: 2.0, sell-price: 0.5 }
      pumpkin: { material: PUMPKIN, buy-price: 4.0, sell-price: 1.5 }

  food:
    display-name: "<gold>Food"
    icon: COOKED_BEEF
    order: 3
    items:
      bread: { material: BREAD, buy-price: 5.0, sell-price: 1.5 }
      cooked-beef: { material: COOKED_BEEF, buy-price: 10.0, sell-price: 3.0 }
      cooked-chicken: { material: COOKED_CHICKEN, buy-price: 8.0, sell-price: 2.5 }
      golden-apple: { material: GOLDEN_APPLE, buy-price: 500.0 }

  tools:
    display-name: "<aqua>Tools & Weapons"
    icon: DIAMOND_PICKAXE
    order: 4
    items:
      wooden-sword: { material: WOODEN_SWORD, buy-price: 10.0 }
      stone-sword: { material: STONE_SWORD, buy-price: 25.0 }
      iron-sword: { material: IRON_SWORD, buy-price: 75.0 }
      iron-pickaxe: { material: IRON_PICKAXE, buy-price: 100.0 }
      diamond-pickaxe: { material: DIAMOND_PICKAXE, buy-price: 600.0 }
      bow: { material: BOW, buy-price: 60.0 }
      arrow: { material: ARROW, buy-price: 1.0, sell-price: 0.25 }

  blackmarket:
    display-name: "<dark_red>Black Market"
    icon: NETHERITE_INGOT
    order: 5
    permission: youneedme.shop.blackmarket
    items:
      netherite-ingot: { material: NETHERITE_INGOT, buy-price: 5000.0, stock: 10 }
      # A shop item can carry the same full set of properties as a kit item: display name, lore,
      # enchantments, item flags, unbreakable, custom model data - not just material/price/stock.
      enchanted-bow:
        material: BOW
        buy-price: 2500.0
        stock: 5
        display-name: "<dark_red><bold>Reaper's Bow"
        lore:
          - "<gray>Pulled from the black market's darkest corner."
        enchantments:
          power: 5
          infinity: 1
        flags: [HIDE_ENCHANTS]
        unbreakable: true
      elytra: { material: ELYTRA, buy-price: 15000.0, stock: 1 }

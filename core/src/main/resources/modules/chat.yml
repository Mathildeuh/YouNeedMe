# Chat formatting module.
enabled: true
# Available placeholders (MiniMessage tag syntax, not curly braces): <prefix> <suffix> <group>
# <player> <message> - <player> already resolves the player's nickname (see the nickname module)
# when one is set. <prefix>/<suffix>/<group> come from LuckPerms and are empty/"default" without it.
format: "<prefix><white><player></white><suffix> <gray>»</gray> <message>"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Split from the Pages deploy on purpose: that job requires a "github-pages" GitHub Environment,
  # and referencing an environment that isn't configured for the repo fails the whole job before a
  # single step runs (no logs, just "workflow file issue") - which used to take the plugin jar
  # release down with it every single time, since both lived in one job.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shaded plugin jar
        run: ./gradlew build --console=plain

      - name: Attach the plugin jar to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/YouNeedMe.jar
          generate_release_notes: true

      # JitPack builds the `api` module on demand straight from this tag - nothing to publish here,
      # a consumer just needs `com.github.Mathildeuh.YouNeedMe:api:<tag>` to trigger the first build.

      - name: Publish to Modrinth
        uses: modrinth/minotaur@v3
        continue-on-error: true
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project-id: youneedme
          version-type: release
          files: build/libs/YouNeedMe.jar
          changelog-file: CHANGELOG.md
          loaders: [paper, purpur, folia, spigot]
          game-versions: ["1.21"]

      - name: Publish to Hangar
        uses: HangarMC/hangar-publish-action@v0.2.0
        continue-on-error: true
        with:
          api_key: ${{ secrets.HANGAR_API_KEY }}
          version: ${{ github.ref_name }}
          channel: Release
          id: YouNeedMe
          platforms: PAPER
          platform_versions: '{"PAPER": ["1.21"]}'
          files: '[{"platforms": ["PAPER"], "path": "build/libs/"}]'

  javadoc:
    runs-on: ubuntu-latest
    # Requires a "github-pages" environment, which GitHub only provisions once Pages is enabled for
    # this repo (Settings > Pages > Source: GitHub Actions) - harmless to leave failing until then,
    # since it no longer shares a job with the actual release.
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build API javadoc
        run: ./gradlew :api:javadoc --console=plain

      - name: Upload Javadoc to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: api/build/docs/javadoc

      - name: Deploy Javadoc
        id: deploy-pages
        uses: actions/deploy-pages@v4

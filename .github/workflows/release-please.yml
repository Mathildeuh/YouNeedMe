name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag/release created by release-please-action uses the default GITHUB_TOKEN, and GitHub
  # deliberately does not let a GITHUB_TOKEN-authored push/release trigger ANOTHER workflow (its
  # anti-recursion protection) - so a separate release.yml with `on: push: tags: [...]` would never
  # actually fire for these tags. This is the officially documented workaround: chain the publish
  # steps as a follow-up job in THIS workflow, gated on release-please's own output, instead of
  # relying on the tag push to trigger anything.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shaded plugin jar
        run: ./gradlew build --console=plain

      - name: Attach the plugin jar to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" build/libs/YouNeedMe.jar --clobber

      # JitPack builds the `api` module on demand straight from this tag - nothing to publish here,
      # a consumer just needs `com.github.Mathildeuh.YouNeedMe:api:<tag>` to trigger the first build.

      # modrinth/minotaur is a Gradle plugin only - it has no `action.yml`, so `uses:
      # modrinth/minotaur@v3` (the original scaffold) could never have worked as a GitHub Action
      # regardless of `with:` formatting. mc-publish is the real, maintained action for this.
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          modrinth-id: youneedme
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ needs.release-please.outputs.tag_name }}
          modrinth-version-type: release
          files: build/libs/YouNeedMe.jar
          # modrinth-changelog-file: CHANGELOG.md used the WHOLE file (every version ever released)
          # as this version's changelog - release-please's own `body` output is scoped to just this
          # release, which is what a version's changelog on Modrinth is supposed to show.
          modrinth-changelog: ${{ needs.release-please.outputs.body }}
          modrinth-loaders: |
            paper
            purpur
            folia
            spigot
          # >=1.21 rather than a hardcoded upper bound - Paper's own versioning has since moved to
          # a year.minor scheme (26.2/26.3 are the current line - see README), but Modrinth's game
          # version list is keyed off vanilla Minecraft version strings, not Paper's; an open-ended
          # lower bound keeps this correct as new versions ship instead of going stale every release.
          modrinth-game-versions: ">=1.21"
          modrinth-game-version-filter: releases

      # Hangar's 15 MiB upload limit is lower than the shaded jar size. Publish an external
      # version download pointing at the asset attached to this GitHub release instead.
      # Hangar requires the URL to target the version asset directly, rather than the releases page.
      - name: Publish to Hangar
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_API_KEY }}
          slug: YouNeedMe
          version: ${{ needs.release-please.outputs.tag_name }}
          channel: Release
          description: ${{ needs.release-please.outputs.body }}
          files: |
            [
              {
                "platforms": ["PAPER"],
                "url": true,
                "externalUrl": "https://github.com/Mathildeuh/YouNeedMe/releases/download/${{ needs.release-please.outputs.tag_name }}/YouNeedMe.jar"
              }
            ]

  javadoc:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build API javadoc
        run: ./gradlew :api:javadoc --console=plain

      - name: Upload Javadoc to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: api/build/docs/javadoc

      - name: Deploy Javadoc
        uses: actions/deploy-pages@v4

name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # full history required for pull request analysis

      - name: Qodana Scan
        id: qodana
        # Qodana Linters have required a Qodana Cloud connection (QODANA_TOKEN) since 2023.2 - it
        # refuses to run at all without one, unlike Modrinth/Hangar's "best-effort" publish steps.
        # continue-on-error here so a missing token doesn't fail the whole run (and spam commit
        # status emails) until QODANA_TOKEN is set up - see docs/QODANA_SETUP.md.
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2.1
        with:
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload SARIF to GitHub code scanning
        if: steps.qodana.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # full history required for pull request analysis

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.1
        with:
          upload-result: true
        env:
          # Optional: set a QODANA_TOKEN repo secret (from a project on qodana.cloud) for the full
          # cloud dashboard/history. Without it, this still runs and uploads findings straight to
          # GitHub's own Security > Code scanning tab via the SARIF step below.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

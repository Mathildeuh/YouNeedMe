name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Paper ${{ matrix.paper-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper-label: "26.2 (stable)"
            paper-version: ""
          - paper-label: "26.3 (pre-release)"
            paper-version: "26.3.build.+"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          if [ -n "${{ matrix.paper-version }}" ]; then
            ./gradlew build -PpaperApiVersion=${{ matrix.paper-version }} --console=plain
          else
            ./gradlew build --console=plain
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.paper-label }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.paper-label }}
          path: "**/build/reports/jacoco/"
          if-no-files-found: ignore

      - name: Upload plugin jar
        if: matrix.paper-version == ''
        uses: actions/upload-artifact@v4
        with:
          name: YouNeedMe-jar
          path: build/libs/YouNeedMe-*.jar

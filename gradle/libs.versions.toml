[versions]
# --- Language / toolchain ---
java = "25"

# --- Server API ---
# Paper 26.2 ("Chaos Cubed") is the current stable line; 26.3 is pre-release. The main build
# compiles against 26.2 - CI additionally builds against 26.3 by overriding this with
# `-PpaperApiVersion=26.3.build.+` (see ci.yml) to catch forward-compat regressions early.
paper-api = "26.2.build.+"

# --- Third-party integrations (all compileOnly / soft-depend) ---
vault-api = "1.7.1"
luckperms-api = "5.5"
placeholderapi = "2.11.6"
floodgate-api = "2.2.5-SNAPSHOT"
# DiscordSRV is integrated purely via reflection at runtime (no compile-time dependency,
# see core's DiscordSrvBridge) - v1.30.5 is the version that reflection targets.

# --- Storage ---
hikaricp = "7.1.0"
sqlite-jdbc = "3.53.4.0"
mariadb-java-client = "3.5.10"
postgresql = "42.7.13"
mongodb-driver-sync = "5.12.0"
jedis = "8.1.0-beta1"
gson = "2.14.0"
bstats-bukkit = "3.2.1"

# --- Build quality tooling ---
shadow = "9.6.1"
spotless = "8.10.2"
checkstyle-tool = "14.1.0"
pmd-tool = "7.27.0"
google-java-format = "1.36.1"

# --- Testing ---
junit-jupiter = "6.1.3"
mockbukkit = "4.116.1"
mockito = "5.23.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }

vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms-api" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
floodgate-api = { module = "org.geysermc.floodgate:api", version.ref = "floodgate-api" }

hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-java-client" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver-sync" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats-bukkit" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
